[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcrsaits"
version = "1.0.0"
description = "PCR-SAITS lightweight residual correction for SAITS and BRITS imputation"
readme = "README.md"
authors = [{name = "Sawet Somnugpong"}]
license = "MIT"
keywords = ["time-series", "imputation", "SAITS", "BRITS", "missing-data"]
requires-python = ">=3.9"
dependencies = ["numpy", "torch", "pypots"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pcrsaits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Repository = "https://github.com/qoozbass/PCR-SAITS"
Paper = "https://doi.org/10.1016/j.eswa.2026.134510"
Archive = "https://doi.org/10.5281/zenodo.22973879"
