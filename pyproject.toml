[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcrsaits"
version = "1.1.0"
description = "PCR lightweight residual correction for SAITS, BRITS, and CSDI time-series imputation"
readme = "README.md"
authors = [{name = "Sawet Somnugpong"}]
license = "MIT"
keywords = ["time-series", "imputation", "SAITS", "BRITS", "CSDI", "missing-data"]
requires-python = ">=3.9"
dependencies = ["numpy", "torch", "pypots>=1.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pcrsaits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Repository = "https://github.com/qoozbass/PCR-SAITS"
PyPI = "https://pypi.org/project/pcrsaits/"
Paper = "https://doi.org/10.1016/j.eswa.2026.134510"
Archive = "https://doi.org/10.5281/zenodo.22973878"
"Archive v1.1.0" = "https://doi.org/10.5281/zenodo.23000374"
